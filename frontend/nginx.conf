server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Una corrida del mapeo no tiene límite de tiempo, así que el proxy tampoco puede tenerlo:
    # con el valor por defecto de 60 s, `POST /ejecutar` o una lectura de resultado grande
    # devolverían 504 aunque la API estuviera trabajando bien.
    proxy_connect_timeout 60s;
    proxy_send_timeout    1h;
    proxy_read_timeout    1h;

    client_max_body_size 64m;   # el archivo de validación es un JSON de corrida completo

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;    # el log de la corrida llega a trozos
    }

    # React Router usa rutas del navegador: cualquier ruta desconocida devuelve el index y la
    # resuelve el cliente. Sin esto, recargar en /intentos/<id> daría 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
