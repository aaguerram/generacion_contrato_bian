[project]
name = "generacion-contrato-ia-v2"
version = "0.1.0"
description = "Validación de BIAN Service Domains con LangGraph + RAG + LLM swappable y trazas LangSmith."
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain",
    "langchain-core",
    "langchain-google-genai",
    "langchain-openai",          # OpenRouter (API compatible OpenAI) + OpenAI
    "langchain-cohere",          # embeddings Cohere (RAG vectorial multilingüe)
    "langsmith",
    "python-dotenv",
    "pyyaml",                    # config.yaml
    "pydantic",
    "rapidfuzz",
    "numpy",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic"]
# Índice vectorial externo (ver docs/adr/0001-vector-store.md). No hace falta con vector_store=memoria.
qdrant = ["qdrant-client"]
# Reranker cross-encoder local. Arrastra torch (~3 GB); sin él el reranker no reordena y avisa.
reranker = ["sentence-transformers"]

[project.scripts]
validar-sd = "src.adaptadores.entrada.cli:main"
mapear-historias = "src.adaptadores.entrada.cli_mapeo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "docs", "salida", "graphify-out"]

[tool.ruff.lint]
# E501 (line-too-long) queda fuera a propósito: el formatter ya corta lo que puede,
# y lo que no (URLs, strings de prompt) no debe ensuciar el diagnóstico del editor.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# `unit_test`/`e2e` son los nombres con que se importan los tests entre sí
# (unittest discover -s tests inserta `tests/` como top_level_dir).
known-first-party = ["src", "tests", "unit_test", "e2e"]
