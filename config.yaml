version: "1.0"

# ═══════════════════════════════════════════════════════════════════════════════
#  Toda la configuración movible del proyecto.
#  El .env SOLO lleva API keys (una por proveedor). Aquí van modelos, orden,
#  umbrales y rutas.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Orden de failover ────────────────────────────────────────────────────────
#  Se intenta el 1er proveedor con TODOS sus modelos en orden; si ninguno tiene
#  cuota (429 / sin créditos / no disponible), se pasa al siguiente proveedor y
#  se recorren sus modelos. Es un reintento hasta agotar todo.
#
#  Ollama va primero: servidor propio (docker en la red local), sin cuota ni free-tier ni
#  rate limit -- tanto para chat como para embeddings. Si no está accesible (VPN caída, docker
#  detenido), el failover cae a Groq: inferencia LPU muy rápida (0.7-2.5s), free tier generoso
#  y modelos fuertes (gpt-oss). Luego Gemini, luego Hugging Face (modelos fuertes pero crédito
#  mensual free muy pequeño) y OpenRouter (free lento) como último recurso.
routing:
  llm_priority: [groq, gemini, huggingface, openrouter, ollama]
  # Embeddings SOLO para validar_sd.rag_estrategia: vectorial. Orden = precisión de retrieval.
  # Ollama primero (propio, sin cuota); Cohere, Gemini y OpenRouter de respaldo.
  embedding_priority: [ollama, cohere, gemini, openrouter]

  # Orden DISTINTO para nodos concretos, por `prompt_id`. Los 7 nodos LLM no tienen la misma
  # dificultad ni el mismo tamaño de prompt: `mapeo.intencion` lo resuelve cualquier modelo, y
  # `mapeo.operaciones` -que debe devolver un operationId literal entre decenas- es el primero en
  # romperse con un modelo débil (corrida real del 2026-09-14: Groq 413 por tamaño, Gemini sin
  # cuota, respondió un modelo más pequeño y no ancló ni una operación).
  #
  # OJO con lo que esto NO arregla: cada LLAMADA ya recorre su cadena desde el principio, así que
  # un proveedor que falló con 413 en un nodo de prompt grande SE VUELVE A INTENTAR en el
  # siguiente nodo, que quizá sí le cabe. Eso no hay que configurarlo -- lo fija
  # `tests/unit_test/test_failover.py::TestFailoverReintentaLaCadenaEnCadaLlamada`.
  #
  # Vacío = todos los nodos comparten `llm_priority`. `--proveedor X` sigue mandando sobre esto.
  llm_priority_por_nodo: {}
  #   mapeo.operaciones: [ollama, groq, gemini, huggingface, openrouter]   # 262k de contexto, sin cuota
  #   mapeo.evaluacion:  [groq, gemini, huggingface, openrouter, ollama]

# ── Proveedores ─────────────────────────────────────────────────────────────
#
#  PRESUPUESTO DE ENTRADA POR MODELO (`max_input_tokens`)
#  ------------------------------------------------------
#  Cada modelo puede declarar cuántos tokens de ENTRADA admite. Antes de cada llamada,
#  `ChatConFailover` estima el tamaño del prompt y **se salta sin llamar** a todo modelo cuyo
#  presupuesto no lo admita: los intentos se gastan solo donde el contexto entra, en vez de
#  pagar un round-trip para leer un 413 previsible. Si NINGÚN modelo lo admite se lanza
#  `PeticionDemasiadoGrande` -- la misma señal que un 413 real --, así que el paso de candidatos
#  reduce el catálogo por escalones y vuelve a intentar. Antes de esto, un nodo de prompt grande
#  gastaba una llamada fallida por modelo, en cada corrida.
#
#  Dos formas admitidas por elemento de `models`:
#      models:
#        - openai/gpt-oss-120b            # sin presupuesto: se llama y se aprende del 413
#        - name: openai/gpt-oss-20b
#          max_input_tokens: 12000
#  y `llm.max_input_tokens` a nivel de proveedor como valor por defecto de sus modelos (es lo
#  habitual: el límite lo pone el PLAN, no el modelo).
#
#  Cómo elegir el número: ventana de contexto del modelo MENOS lo que ocupará la respuesta.
#  Pasarse solo devuelve al comportamiento de antes (413 real, que también se aprende);
#  quedarse corto desperdicia un modelo que sí servía. El estimador es aproximado (~10-20%),
#  por eso el 413 sigue existiendo como red.
#
#  ¡OJO! Solo el de Groq está MEDIDO en este repo (su free tier corta en ~15k tokens/min y el
#  catálogo BIAN de ~36k tokens siempre devolvía 413). El resto son presupuestos declarados a
#  partir de la ventana de contexto publicada de cada modelo: ajústalos a tu plan.
providers:
  # ── Ollama: servidor propio (docker, qwen3.8 27B para chat + qwen3-embedding 8B para
  #  embeddings). API compatible OpenAI vía `/v1`, sin autenticación real -- ver OLLAMA_API_KEY
  #  en `.env` (placeholder exigido por el cliente, no un secreto). Ajusta `base_url` si el
  #  docker corre en otro host/puerto.
  ollama:
    enabled: true
    api_key_env: OLLAMA_API_KEY
    base_url: http://100.102.221.79:11434/v1
    structured_method: json_schema
    llm:
      # Servidor propio: el límite lo pone el `num_ctx` con el que se sirve el modelo (262k
      # declarados), no un plan. Se deja margen para la respuesta.
      max_input_tokens: 200000
      models:
        - qwen3.8:27b-q8_0
    embedding:
      models:
        - qwen3-embedding:8b

  groq:
    enabled: true
    api_key_env: GROQ_API_KEY
    base_url: https://api.groq.com/openai/v1
    structured_method: json_schema
    llm:
      # MEDIDO: el free tier corta en ~15k tokens/min y devuelve 413 "Request too large".
      # 12000 deja margen para la respuesta dentro de esa misma ventana de minuto.
      max_input_tokens: 12000
      models:
        - openai/gpt-oss-120b               # ~nivel gemini-3.8-flash, ~2.5s, structured OK
        - openai/gpt-oss-20b                # más rápido (~0.7s), algo menos calibrado
    # NOTA: el free tier de Groq limita ~15k tokens/min. `validar-sd` (prompts pequeños)
    # sí usa Groq; `mapear-historias` (catálogo BIAN ~36k tokens con rol_max_chars=600) NO le
    # cabe: con `max_input_tokens` declarado esos nodos ya ni se le mandan. Groq no publica
    # endpoint de embeddings.

  huggingface:
    enabled: true
    api_key_env: HF_TOKEN
    base_url: https://router.huggingface.co/v1
    structured_method: json_schema
    llm:
      # Los tres publican ventana de 128k; el techo real aquí es el crédito, no el contexto.
      max_input_tokens: 100000
      models:
        - deepseek-ai/DeepSeek-V4-Flash             # flash frontier, ~3s, structured OK
        - openai/gpt-oss-120b                       # ~0.5s, mejor calibrado
        - meta-llama/Llama-3.3-70B-Instruct         # sólido de respaldo, ~2s
    # NOTA: el free tier de HF Inference es un crédito mensual pequeño (~$0.10). Cuando se
    # agota devuelve 402/"exceeded credits" y el failover pasa a OpenRouter.

  openrouter:
    enabled: true
    api_key_env: OPENROUTER_API_KEY
    base_url: https://openrouter.ai/api/v1
    structured_method: json_schema          # cómo pedir salida estructurada
    llm:
      # Los `:free` recortan contexto respecto al modelo de pago; presupuestos conservadores.
      # El auto-router va al final y es el más incierto: no se sabe qué modelo sirve la petición.
      models:
        - name: nvidia/nemotron-3-super-120b-a12b:free
          max_input_tokens: 60000
        - name: nvidia/nemotron-3.5-lightning:free
          max_input_tokens: 60000
        - name: google/gemma-4-31b-it:free
          max_input_tokens: 30000
        - name: openrouter/free              # auto-router de modelos free (último recurso)
          max_input_tokens: 30000
    embedding:
      models:
        - openai/text-embedding-3-small

  gemini:
    enabled: true
    api_key_env: GOOGLE_API_KEY
    llm:
      # Ventana de 1M; el límite del free tier es de PETICIONES/día, no de tamaño. Es el único
      # proveedor de la cadena al que el catálogo BIAN completo le cabe con holgura.
      max_input_tokens: 900000
      models:
        - gemini-3.6-flash                   # free tier 20 req/día
        - gemini-3.5-flash
        - gemini-3.5-flash-lite
    embedding:
      models:
        - models/gemini-embedding-001

  # ── Cohere: SOLO embeddings (retrieval multilingüe ES↔EN) ──────────────────
  #  Token free-tier / "trial key": acceso a TODOS los modelos de embed, límite de
  #  RATIO (~100 req/min · 1000 req/mes), no de modelo. `input_type` lo pone Cohere solo.
  #  Lista ordenada por PRECISIÓN de retrieval (el 1º es el que más rinde; los demás son
  #  el failover en cascada). Corpus = 341 Service Domains BIAN (texto en inglés);
  #  las consultas pueden venir en español -> pesan los modelos multilingües.
  cohere:
    enabled: true
    api_key_env: COHERE_API_KEY
    embedding:
      models:
        - embed-v4.0                     # 1 · flagship 2025 · multilingüe 100+ idiomas · 128k ctx · mejor MTEB (dim 1536)
        - embed-multilingual-v3.0        # 2 · 1024d · multilingüe probado · query ES vs corpus EN
        - embed-english-v3.0             # 3 · 1024d · top retrieval EN puro (el corpus BIAN es inglés)
        - embed-multilingual-light-v3.0  # 4 · 384d · multilingüe, rápido y barato · respaldo
        - embed-english-light-v3.0       # 5 · 384d · EN, mínimo · último recurso

  anthropic:
    enabled: false
    api_key_env: ANTHROPIC_API_KEY
    llm:
      max_input_tokens: 180000       # ventana de 200k menos margen para la respuesta
      models:
        - claude-sonnet-5

  openai:
    enabled: false
    api_key_env: OPENAI_API_KEY
    llm:
      max_input_tokens: 110000       # ventana de 128k menos margen para la respuesta
      models:
        - gpt-4o-mini
    embedding:
      models:
        - text-embedding-3-small

# ── Parámetros LLM comunes ──────────────────────────────────────────────────
llm:
  temperature: 0.0
  seed: 42                       # reproducibilidad del chat (si el SDK lo soporta); null = sin seed
  esfuerzo: low                  # low | medium | high  (presupuesto de razonamiento)
  reintentos_transitorios: 4     # reintentos por 503/timeout/overloaded ANTES de pasar al siguiente modelo
  backoff_inicial_seg: 2.0
  backoff_max_seg: 30.0
  # Cómo se mide un prompt contra el `max_input_tokens` de cada modelo (ver providers):
  #   caracteres  (por defecto) -> len(prompt) / chars_por_token. Sin dependencias y sin red.
  #   tiktoken                  -> tokenización real (o200k_base), más precisa.
  # `tiktoken` NO es el default a propósito: descarga el vocabulario la primera vez y, sin salida
  # a Internet, la llamada se cuelga -- se comprobó colgando la primera invocación LLM. Aun
  # activándolo, la carga tiene plazo y degrada al heurístico en vez de bloquear.
  tokenizador: caracteres
  chars_por_token: 4.0           # razón del estimador por caracteres

# ── Observabilidad (LangSmith) ─────────────────────────────────────────────
observabilidad:
  langsmith_tracing: false
  langsmith_project: generacion-contrato-ia-v2
  # langsmith_endpoint: https://api.smith.langchain.com

# ═══════════════════════════════════════════════════════════════════════════════
#  validar-sd   (python -m src --service-domain "<nombre>" --directorio <ruta>)
# ═══════════════════════════════════════════════════════════════════════════════
validar_sd:
  rag_estrategia: lexico         # lexico (rapidfuzz, sin API) | vectorial (embeddings)
  rag_top_k: 6
  rag_umbral_alto: 0.90          # similitud_nombre >= alto -> coincide (determinista, 0 API)
  rag_umbral_bajo: 0.60          # similitud_nombre <  bajo -> no coincide (determinista, 0 API)
  # Fuente ÚNICA de Service Domains (341: textos + clasificación + jerarquía).
  # Sus huecos se completan con SD.json vía scripts/enrich_service_landscape/.
  ruta_catalogo_bian: docs/BIAN_Service_Landscape_V14.0_Matrix_View.json

# ═══════════════════════════════════════════════════════════════════════════════
#  mapear-historias   (python -m src mapear-historias --hu <dir> --func <f.json> --dir <out>)
# ═══════════════════════════════════════════════════════════════════════════════
mapear_historias:
  umbral_directo: 0.90           # confianza >= directo  Y  rol=OWNED_CONTRACT -> candidato directo
  umbral_tentativo: 0.63         # tentativo <= confianza < directo -> tentativo; menos -> descartado
  # El subgrafo por HU hace fan-out por candidato: 1 llamada LLM aislada por Service Domain a
  # evaluar (paquete de evidencia oficial cerrado). Llamadas totales por corrida ≈
  #   HU * (3 + n_candidatos + 2) + 1     (intención+candidatos+completitud + N evaluaciones + adversarial+operaciones + reconciliación)
  # OJO: concurrencia * concurrencia_candidatos = llamadas LLM simultáneas. Con free tiers
  # pequeños (p. ej. Gemini 20 req/día) usa --proveedor pinneado o baja max_candidatos_hu.
  concurrencia: 1               # historias en paralelo (LangGraph max_concurrency, outer)
  concurrencia_candidatos: 1    # candidatos evaluados en paralelo dentro de una HU (subgrafo)
  max_candidatos_hu: 14         # tope de Service Domains evaluados por HU (LLM candidatos + missing)
  paso2_operaciones: true        # paso 6: mapear SD directos -> operaciones oficiales CR/BQ
  rol_max_chars: 600             # recorte del Service Role al armar el catálogo del prompt
                                 # (240 recortaba 219 de los 341 SD; 600 deja solo 26, +9.7k tokens)
  # ── Routing jerárquico: el paso de candidatos en DOS nodos ────────────────
  #  2a `enrutar_dominios`  -> elige Business Domains sobre la taxonomía (36 vías, con la
  #                            documentación COMPLETA de cada nodo de la jerarquía, ~4.3k tok)
  #  2b `generar_candidatos`-> ve solo los SD de esos dominios, pero con el TEXTO ENTERO:
  #                            rol sin recortar + examples_of_use + features (~189 tok por SD)
  #  La ganancia no es mirar menos, es poder mostrarlo todo de los que quedan -- hoy nadie ve
  #  nunca los examples_of_use y 26 roles van cortados. Medido sobre los 341 SD reales:
  #  41.1k -> ~11.4k tokens (mediana 3 dominios), y a ese tamaño Groq vuelve a caber.
  #  Riesgo que introduce: un dominio no elegido es invisible. Redes activas: el prompt de 2a
  #  exige dominios para las external_dependencies y un mínimo de 3; el filtrado es determinista
  #  y cae al catálogo COMPLETO si no resuelve ninguno; y el nodo 3 sigue viendo el índice de los
  #  341 nombres (`missing_candidates`). Vigila `metricas.routing_*`. Si empieza a perder
  #  candidatos, la red pendiente está documentada en implementacion_pendiente.md §10.
  routing_jerarquico_habilitado: true
  # Canal DETERMINISTA del nodo 2a (docs/entity.json, 0 llamadas LLM): qué Service Domain DEFINE
  # cada clase del BOM que la historia necesita. La ocurrencia SIN `notes.Extensible` es la del
  # dueño; las que la llevan son cajas importadas del modelo genérico (`Party` se define en Party
  # Reference Data Directory y se importa en otros 129 SD). Los propietarios así atribuidos se
  # añaden al catálogo enrutado aunque el LLM no eligiera su Business Domain -incidencia
  # ROUTING_PROPIETARIO_DE_CLASE_BOM-, que es justo el modo de fallo medido del router.
  # OFF por defecto: encenderlo es una decisión de producto. Ya está MEDIDO (2026-09-20,
  # scripts/evaluate_retrieval/README.md, hu_real n=6): el canal solo (bm25+vectorial) da
  # Recall@10 1.00 / MRR 0.569 frente a 0.67 / 0.573 del mejor canal de texto del SD, y fusionado
  # con él 1.00 / 0.639 -recupera las dos HU de "actualizar" que el texto del SD dejaba en los
  # puestos 29 y 14-. Es ciego al eje de la ACCIÓN (Correspondence en la HU de notificación llega
  # por el canal vectorial, puesto 5): complementa al router, no lo sustituye.
  entidades_bom_habilitado: true
  # Tope de propietarios que el canal puede añadir al catálogo de 2b. Medido con bm25+vectorial,
  # el positivo cae en los puestos 1,5,9,10,1,1: con 5 se rescatan 4 de 6, con 10 los 6. Cada SD
  # añadido cuesta ~189 tokens en 2b, nunca un candidato, así que el tope puede ser generoso.
  entidades_max_candidatos: 10
  ruta_entidades: docs/entity.json
  # Paso 1 del canal (qué clases del BOM pide la HU) como recuperación híbrida. Canales:
  #   diccionario -> CLASES_BOM_POR_TERMINO (ES->EN a mano, sin índice; el de siempre)
  #   bm25        -> BM25 sobre el documento de cada clase con dueño (nombre + definición +
  #                  atributos + valores de enum), consulta traducida. Sin red.
  #   vectorial   -> embeddings multilingües sobre ese mismo documento, consulta en español tal
  #                  cual (quita la dependencia del diccionario). Usa routing.embedding_priority;
  #                  sin proveedor utilizable se omite con aviso.
  # Con más de un canal se fusionan con RRF (entidades_rrf_k). Medido (hu_real, n=6, MRR):
  # diccionario 0.372 · bm25 0.378 · vectorial 0.339 · bm25+vectorial 0.569 · los tres 0.517.
  # El diccionario RESTA en la fusión (mete Party por "cliente" en todas las HU y aplana el
  # ranking), por eso el default es bm25+vectorial. Sin embeddings utilizables queda bm25 solo.
  #   .venv/bin/python scripts/evaluate_retrieval/evaluate.py --tipo hu_real \
  #       --canales rrf-bm25,bom-dic,bom-bm25,bom-vec,bom-rrf,bom-rrf3,rrf-bm25+bom-rrf
  entidades_canales: [bm25, vectorial]
  entidades_top_k_clases: 12
  entidades_rrf_k: 20
  top_n_omitidos: 5             # 2º pase léxico: nº de SD "posibles omitidos" a reportar por HU (0 = off)
  ruta_operaciones: docs/bian-operation-catalogs.json
  ruta_cache_bian: docs/bian-cache        # cache-first del OpenAPI oficial (CR + BQ + schemas con cuerpo)
  ruta_bian_puml: docs/bian-diagrams/puml-bom          # 272 diagramas BOM UML BIAN R14 (clases/atributos/asociaciones)
  bom_puml_habilitado: true               # suma el modelo de clases del PUML al paquete de evidencia
  release_bian: "14.0.0"
  descargar_faltantes: true

  # Retrieval híbrido (RRF léxico+vectorial en memoria) antes del fan-out, para reinyectar
  # candidatos que el LLM no propuso -- ver implementacion_pendiente.md, Fase 3. Reusa los mismos
  # adaptadores de validar-sd (RecuperadorLexico siempre; RecuperadorVectorial solo si hay un
  # proveedor de embeddings utilizable en routing.embedding_priority, si no degrada a solo léxico).
  # OFF por defecto a propósito: es aditivo y tiene tests propios, pero cambia qué candidatos entran
  # al fan-out en corridas existentes -- encenderlo es una decisión de producto respaldada por el
  # benchmark de recall de Fase 3, no un default silencioso.
  retrieval_hibrido_habilitado: false
  # Graph RAG y reranker son flags SEPARADOS del híbrido: se activan por separado para poder
  # medir qué aporta cada uno (canary/shadow) en vez de encenderlo todo a la vez.
  graph_rag_habilitado: false    # expande candidatos por relaciones verificadas del BOM BIAN
  graph_rag_max_inyectados: 3    # tope de candidatos NUEVOS que puede añadir el grafo por HU
  ruta_grafo_bian: docs/bian-graph/release14.0.0/grafo.json   # lo genera scripts/ingest_bian/
  vector_store: memoria          # memoria (InMemoryVectorStore) | qdrant (infra/retrieval/)
  qdrant_url: http://localhost:6333
  qdrant_coleccion: bian_service_domains
  reranker_habilitado: false     # reordena antes del recorte por max_candidatos_hu
  reranker_modelo: BAAI/bge-reranker-v2-m3   # cross-encoder local; sin sentence-transformers degrada a léxico
  presupuesto_segundos_hu: 0     # 0 = sin límite; >0 corta el retrieval opcional si se pasa
  retrieval_top_k: 20            # top-k que pide cada recuperador (léxico y vectorial) antes de fusionar
  retrieval_max_inyectados: 5    # tope de candidatos NUEVOS que el retrieval híbrido puede añadir por HU

  # Canal disperso + fusión. Medido (scripts/evaluate_retrieval/): con rapidfuzz -que compara la
  # consulta contra el NOMBRE del SD- el canal léxico acierta 0.29 en lenguaje natural y arrastra
  # la fusión de 0.86 a 0.71. `bm25` indexa el TEXTO del SD y pesa términos por IDF; los pesos y
  # `rrf_k` dejan de tratar por igual a los dos canales. Los defaults reproducen lo de siempre.
  retrieval_canal_lexico: rapidfuzz   # rapidfuzz | bm25
  rrf_k: 60                      # constante del paper; con 341 SD y top-20, 10-20 diferencia más
  rrf_peso_lexico: 1.0
  rrf_peso_vectorial: 1.0

  # CAG escalonado: el catálogo entero cabe en contexto (~93k tokens), así que a esta escala el
  # recall es un problema opcional. 0 = índice de siempre (nombre + rol a 90 chars, ~10k tokens);
  # 300 chars/SD ≈ 25k tokens (entra en cualquier modelo del failover); ~1200 = catálogo completo.
  cag_habilitado: false
  cag_chars_por_sd: 300

  # El grafo canónico BIAN como HECHO determinista para el revisor adversarial (cuántos SD modelan
  # el mismo objeto, qué candidatos comparten clase BOM). No decide nada: solo se le muestra.
  grafo_senales_adversarial: false

  # CRAG: UNA vuelta correctiva de recuperación cuando el lote de evidencia sale vacío o sin BOM.
  crag_reintento_habilitado: false

  # Caché de nodos LangGraph en disco + durabilidad. La caché hace barato medir flag por flag y
  # convierte un re-run tras un fallo de cuota en "solo lo que falta". La clave incluye la cadena
  # de modelos y el SHA del catálogo: nunca reutiliza el resultado de otro modelo/evidencia.
  cache_nodos_habilitado: false
  cache_nodos_ruta: .cache/nodos-langgraph
  cache_nodos_ttl: 0             # segundos; 0 = sin expiración
  durabilidad: exit              # exit | sync | async (sync/async activan checkpointer)
  # Base del checkpointer persistente (SQLite). Se CREA si no existe, directorios incluidos, y
  # solo se abre cuando durabilidad != exit. Vive bajo .cache/ y nunca se versiona (.gitignore).
  checkpoint_ruta: .cache/checkpoints/mapeo.sqlite
