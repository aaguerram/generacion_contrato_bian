casos:
- id: crear-pantalla-datos-personales
  tipo: hu_real
  hu: Crear pantalla de datos personales
  consulta: consultar y mostrar los datos personales del cliente, número de celular y correo electrónico
  positivo: Party Reference Data Directory
  hard_negatives:
  - Customer Workbench
  - Party Authentication
  - Transaction Authorization
  procedencia: tests/resources/datos_personales/
  consulta_intencion:
  - pantalla de datos personales
  - información personal
  - información de contacto
  - número celular
  - correo electrónico
  - avatar del usuario
  - nombre completo
  - número de identificación
  procedencia_intencion: tests/resources/datos_personales/expected-result.json (intencion.business_objects, corrida real validada)
